<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0E15" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="turni iDEAli">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect width='30' height='30' rx='9' fill='%231A6FD1'/%3E%3Cpath d='M5 16h5l2.2-5 3.6 10 2.4-6.5 1.3 1.5H25' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>turni iDEAli · Gestione</title>
<style>
:root{
  --accent:#1A6FD1; --accent-ink:#fff; --accent-soft:rgba(26,111,209,.10); --accent-soft2:rgba(26,111,209,.18);
  --bg:#F2F5F9; --card:rgba(255,255,255,.80); --card-solid:#fff; --line:rgba(16,32,64,.09); --line2:rgba(16,32,64,.14);
  --text:#0B1324; --text2:#5A6476; --text3:#8A93A3;
  --ok:#1C9B68; --danger:#D24343; --hol:rgba(26,111,209,.07);
  --m:#E59A1E; --p:#159C95; --n:#4F5BD5; --r:#7C8696;
  --shadow:0 1px 2px rgba(16,32,64,.05),0 8px 28px rgba(16,32,64,.07);
  --radius:22px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --spring:cubic-bezier(.22,1.2,.36,1);
}
:root[data-theme="dark"]{
  --accent:#4D97F2; --accent-soft:rgba(77,151,242,.14); --accent-soft2:rgba(77,151,242,.24);
  --bg:#0A0E15; --card:rgba(26,31,40,.86); --card-solid:#1A1F28; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#F1F4F9; --text2:#A3ADBD; --text3:#717B8C; --hol:rgba(77,151,242,.10);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent:#4D97F2; --accent-soft:rgba(77,151,242,.14); --accent-soft2:rgba(77,151,242,.24);
    --bg:#0A0E15; --card:rgba(26,31,40,.86); --card-solid:#1A1F28; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --text:#F1F4F9; --text2:#A3ADBD; --text3:#717B8C; --hol:rgba(77,151,242,.10);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.4;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(40vmax 40vmax at 8% 0%,rgba(26,111,209,.16),transparent 60%),
             radial-gradient(36vmax 36vmax at 100% 30%,rgba(21,156,149,.10),transparent 60%),
             radial-gradient(44vmax 44vmax at 40% 110%,rgba(79,91,213,.10),transparent 60%)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- cornice dell'anteprima ---------- */
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;color:var(--text2);font-size:12px;letter-spacing:0}
.seg{display:inline-flex;background:var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;white-space:nowrap;padding:8px 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--text2);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--card-solid);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.spacer{flex:1}
.note{font-size:12.5px;color:var(--text2)}
.stage{max-width:1320px;margin:0 auto;padding:28px 20px 60px}
.intro{max-width:760px;margin:0 auto 22px;text-align:center;color:var(--text2);font-size:14.5px}
.intro b{color:var(--text)}

/* ---------- telefono ---------- */
.phone-wrap{display:flex;justify-content:center;gap:40px;align-items:flex-start;flex-wrap:wrap}
.phone{width:390px;height:844px;border-radius:54px;padding:12px;background:#0d0f13;box-shadow:0 30px 80px rgba(10,20,40,.25),inset 0 0 0 2px #2a2d33;position:relative;flex:none}
.phone .screen{width:100%;height:100%;border-radius:43px;overflow:hidden;position:relative;background:var(--bg);isolation:isolate}
.phone .screen::before{content:"";position:absolute;inset:0;z-index:-1;
  background:radial-gradient(260px 260px at 0% 0%,rgba(26,111,209,.16),transparent 70%),radial-gradient(240px 240px at 100% 60%,rgba(21,156,149,.10),transparent 70%)}
.island{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:118px;height:34px;background:#000;border-radius:20px;z-index:40}
.side-notes{max-width:330px;font-size:14px;color:var(--text2)}
.side-notes h3{color:var(--text);font-size:16px;margin:0 0 8px}
.side-notes ul{padding-left:18px;margin:0 0 18px}
.side-notes li{margin:6px 0}
.side-notes code{background:var(--accent-soft);color:var(--accent);padding:2px 7px;border-radius:7px;font-weight:600;font-size:13px}
@media (max-width:520px){
  .stage.full{padding:0}
  .stage.full .intro,.stage.full .side-notes{display:none}
  .stage.full .phone{width:100%;height:calc(100dvh - var(--toph,61px));border-radius:0;padding:0;background:none;box-shadow:none}
  .stage.full .phone .screen{border-radius:0}
  .stage.full .island{display:none}
  .top-in{flex-wrap:nowrap;padding:10px 12px;gap:10px}
  .top .brand>div,.top .spacer,.top .seg[aria-label="Tema"]{display:none}
  .top .seg button{padding:8px 9px;font-size:12.5px}
  .top [data-v="passi"]{display:none}
}

/* ---------- app collega ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.bar{flex:none;padding:58px 18px 10px;display:flex;align-items:center;gap:8px;position:relative;z-index:5}
.stage.full .bar{padding-top:14px}
.back{width:44px;height:44px;border-radius:22px;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.back[hidden]{display:grid;visibility:hidden}
.prog{flex:1}
.prog-track{display:flex;gap:4px}
.prog-track i{flex:1;height:4px;border-radius:3px;background:var(--line2);overflow:hidden;position:relative}
.prog-track i.done{background:var(--accent)}
.prog-track i.now{background:var(--accent-soft2)}
.prog-track i.now::after{content:"";position:absolute;inset:0;width:45%;background:var(--accent);border-radius:3px;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%{transform:translateX(-100%)}60%,100%{transform:translateX(230%)}}
.prog-lab{font-size:12px;color:var(--text2);margin-top:6px;display:flex;justify-content:space-between;font-weight:500}
.scroll::-webkit-scrollbar{display:none}
.scroll{scrollbar-width:none;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:6px 18px 24px;scroll-behavior:smooth}
.view{animation:enter .45s var(--spring) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.h1{font-size:32px;line-height:1.08;letter-spacing:-.025em;font-weight:800;margin:6px 0 8px}
.h2{font-size:22px;letter-spacing:-.02em;font-weight:750;margin:4px 0 6px}
.lead{color:var(--text2);font-size:15.5px;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:17px;background:var(--accent);color:var(--accent-ink);font-weight:650;font-size:17px;letter-spacing:-.01em;transition:transform .2s var(--spring),opacity .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.foot{flex:none;padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 94%,transparent);border-top:1px solid var(--line);position:relative;z-index:5}
.phone .foot{padding-bottom:30px}
.stage.full .phone .foot{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.foot .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-bottom:9px;font-weight:500}

/* benvenuto */
.hero{margin:-6px -18px 0;height:300px;position:relative;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;object-position:35% 50%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(242,245,249,.05) 0%,rgba(242,245,249,.25) 45%,var(--bg) 100%)}
.has-hero .bar{position:absolute;left:0;right:0;top:0}
.has-hero .scroll{padding-top:0}
.logo{display:inline-flex;align-items:center;gap:8px;font-weight:750;font-size:15px;letter-spacing:-.01em;padding:7px 12px 7px 9px;border-radius:14px;background:var(--card-solid);box-shadow:var(--shadow);position:absolute;left:18px;bottom:22px;z-index:2}
.logo b{color:var(--accent)}
.months{display:flex;gap:10px;overflow-x:auto;margin:0 -18px 16px;padding:4px 18px 8px;scroll-snap-type:x mandatory;scroll-padding-inline:18px}
.months::-webkit-scrollbar{display:none}
.mchip{flex:none;scroll-snap-align:start;min-width:132px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:11px 13px;min-height:44px;transition:all .25s var(--spring)}
.mchip b{display:block;font-size:15px;letter-spacing:-.01em}
.mchip span{font-size:12px;color:var(--text2)}
.mchip .tag{display:inline-block;margin-top:5px;font-size:11px;font-weight:650;padding:2px 7px;border-radius:7px;background:var(--accent-soft);color:var(--accent)}
.mchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.mchip[aria-pressed="true"] span{color:rgba(255,255,255,.85)}
.mchip[aria-pressed="true"] .tag{background:rgba(255,255,255,.22);color:#fff}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.fact small{display:block;color:var(--text2);font-size:12px;font-weight:550}
.fact b{font-size:15.5px;letter-spacing:-.01em}
.count{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.count .cdn{font-variant-numeric:tabular-nums;font-size:22px;font-weight:750;letter-spacing:-.02em}
.count .cdn em{font-style:normal;font-size:13px;color:var(--text2);font-weight:600;margin:0 6px 0 2px}
.safe{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--text2);padding:12px 2px}
.safe svg{flex:none;color:var(--ok);margin-top:1px}

/* codice */
.codebox{position:relative;margin:18px 0 10px}
.codein{width:100%;height:76px;border-radius:22px;border:2px solid var(--line2);background:var(--card-solid);text-align:center;font-size:34px;font-weight:700;letter-spacing:.16em;font-variant-numeric:tabular-nums;text-transform:uppercase;outline:none;transition:border-color .2s}
.codein:focus{border-color:var(--accent)}
.codein.ok{border-color:var(--ok)}
.codein.bad{border-color:var(--danger)}
.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.codemsg{min-height:46px;font-size:14px;text-align:center;color:var(--text2)}
.codemsg.bad{color:var(--danger)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;font-size:14px;font-weight:650;background:rgba(28,155,104,.12);color:var(--ok)}
.hint{font-size:13px;color:var(--text2);background:var(--accent-soft);border-radius:14px;padding:10px 12px;margin-top:8px}
.hint code{font-weight:700;color:var(--accent);font-size:13.5px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--accent-soft2);border-top-color:var(--accent);animation:sp .7s linear infinite;display:inline-block;vertical-align:-4px}
@keyframes sp{to{transform:rotate(360deg)}}

/* calendario */
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--text2);margin:2px 0 12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.week{font-size:12px;font-weight:650;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:16px 4px 6px}
.days{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.day{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 12px;border-top:1px solid var(--line);min-height:60px}
.day:first-child{border-top:0}
.day.fest{background:var(--hol)}
.dlab{width:66px;flex:none;line-height:1.15}
.dlab b{font-size:17px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dlab small{display:block;font-size:11.5px;color:var(--text2);font-weight:550;text-transform:capitalize}
.dlab .fname{color:var(--accent);font-weight:650;text-transform:none;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:66px}
.pills{display:flex;gap:6px;flex:1;justify-content:flex-end}
.pill{position:relative;width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card-solid);font-weight:700;font-size:15px;color:var(--text2);transition:transform .25s var(--spring),background .2s,color .2s,border-color .2s}
.pill:active{transform:scale(.9)}
.pill.on{color:#fff;border-color:transparent}
.pill.on[data-t="M"]{background:var(--m)} .pill.on[data-t="P"]{background:var(--p)} .pill.on[data-t="N"]{background:var(--n)} .pill.on[data-t="R"]{background:var(--r)}
.pill .rk{position:absolute;top:-7px;right:-7px;min-width:21px;height:21px;padding:0 5px;border-radius:11px;background:var(--text);color:var(--bg);font-size:11.5px;font-weight:750;display:grid;place-items:center;animation:pop .45s var(--spring) both;box-shadow:0 0 0 2px var(--card-solid)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.repb{width:44px;height:44px;border-radius:14px;border:1.5px dashed var(--line2);background:transparent;display:grid;place-items:center;color:var(--text3);flex:none}
.repb.on{border-style:solid;border-color:var(--danger);color:var(--danger);background:rgba(210,67,67,.08)}

/* foglio reperibilità */
.sheet-bg{position:absolute;inset:0;background:rgba(5,10,20,.35);z-index:60;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;background:var(--card-solid);border-radius:28px 28px 0 0;padding:10px 18px 34px;animation:up .42s var(--spring) both;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 14px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border-top:1px solid var(--line);min-height:56px}
.tog small{display:block;color:var(--text2);font-size:12.5px}
.sw{width:51px;height:31px;border-radius:16px;background:var(--line2);border:0;position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .3s var(--spring)}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}

/* ordine */
.olist{list-style:none;margin:0;padding:0;position:relative}
.oitem{position:relative;margin-bottom:8px;border-radius:18px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.oitem .del{position:absolute;inset:0;border-radius:18px;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:22px;font-weight:650;font-size:14px;gap:6px}
.orow{position:relative;display:flex;align-items:center;gap:10px;padding:8px 6px 8px 10px;min-height:64px;background:var(--card-solid);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(16,32,64,.04)}
.oitem.drag .orow{box-shadow:0 18px 40px rgba(16,32,64,.22);transform:scale(1.03)}
.oitem.drag{z-index:10}
.anim .oitem{transition:transform .38s var(--spring)}
.oitem.drag{transition:none!important}
.num{width:30px;height:30px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:750;display:grid;place-items:center;font-size:14px;flex:none;font-variant-numeric:tabular-nums}
.otxt{flex:1;min-width:0;line-height:1.2}
.otxt b{font-size:15px;letter-spacing:-.01em;display:block}
.otxt small{color:var(--text2);font-size:12.5px;display:block;margin-top:2px}
.otxt small .dot{margin-right:5px;vertical-align:0}
.dot{width:8px;height:8px;border-radius:3px;display:inline-block;flex:none}
.ftag{font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:6px}
.ibtn{width:40px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--text2);flex:none}
.ibtn:active{background:var(--line)}
.ibtn[disabled]{opacity:.25}
.grip{cursor:grab;touch-action:none;color:var(--text3)}
.empty{text-align:center;color:var(--text2);padding:40px 10px;font-size:15px}
.tip{font-size:13px;color:var(--text2);display:flex;gap:8px;align-items:center;margin:0 0 12px}
.repsum{margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:10px;background:rgba(210,67,67,.09);color:var(--danger)}

/* riepilogo */
.mini{list-style:none;margin:0;padding:0}
.mini li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.mini li:first-child{border-top:0}
.mini .n{width:24px;color:var(--text3);font-weight:700;font-variant-numeric:tabular-nums}
.q{margin-top:14px}
.q h3{font-size:18px;letter-spacing:-.015em;margin:0 0 3px}
.q p{margin:0 0 14px;color:var(--text2);font-size:14px}
.step{display:flex;align-items:center;justify-content:center;gap:22px}
.step button{width:52px;height:52px;border-radius:26px;border:0;background:var(--accent-soft);color:var(--accent);font-size:26px;font-weight:600;display:grid;place-items:center}
.step output{font-size:46px;font-weight:800;letter-spacing:-.03em;min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
.step .u{display:block;text-align:center;font-size:13px;color:var(--text2);margin-top:-4px}
textarea.nota{width:100%;min-height:86px;border-radius:16px;border:1.5px solid var(--line2);background:var(--card-solid);padding:12px 14px;font-size:16px;resize:none;outline:none}
textarea.nota:focus{border-color:var(--accent)}
.cnt{text-align:right;font-size:12px;color:var(--text3);margin-top:4px}
label.lab{display:block;font-weight:650;font-size:15px;margin:18px 2px 8px}
label.lab span{font-weight:500;color:var(--text2);font-size:13px}

/* conferma */
.done{text-align:center;padding-top:10px}
.ecg{width:220px;height:110px;margin:6px auto 4px;display:block}
.ecg path{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.4s .15s cubic-bezier(.65,0,.35,1) forwards}
.ecg circle{fill:var(--ok);opacity:.12;transform-origin:150px 55px;animation:ring 1.4s .9s ease-out both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ring{from{transform:scale(.4);opacity:0}50%{opacity:.18}to{transform:scale(1);opacity:.12}}
.receipt{text-align:left;margin-top:18px}

/* ---------- guida interattiva ---------- */
.tour{position:absolute;left:0;right:0;top:0;height:100%;z-index:200;animation:fade .25s both}

.tour-hole{position:absolute;border-radius:18px;box-shadow:0 0 0 9999px rgba(6,12,24,.62),0 0 0 3px rgba(255,255,255,.9);transition:all .5s var(--spring);pointer-events:none}

@keyframes holep{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}
.tour-tip{position:absolute;background:var(--card-solid);border-radius:20px;padding:16px 16px 12px;box-shadow:0 20px 50px rgba(0,0,0,.35);transition:top .45s var(--spring),left .45s var(--spring)}

.onb-dots{display:flex;gap:6px;justify-content:center;margin-bottom:16px}.onb-dots i{width:7px;height:7px;border-radius:4px;background:var(--line2);transition:all .3s}.onb-dots i.on{width:22px;background:var(--accent)}
.onb-skip{border:0;background:transparent;color:var(--text2);font-weight:600;margin-top:8px;min-height:44px;width:100%}

.ill-list span{width:26px;height:26px;border-radius:8px;color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
.ill-list i{flex:1;height:8px;border-radius:4px;background:var(--line2)}.ill-list b{font-size:13px;color:var(--accent)}
.ill-lock .shackle{animation:shk 1.6s .4s cubic-bezier(.5,0,.2,1) both}

function tourSave(){try{localStorage.setItem('tdl-tour',JSON.stringify(TOUR.seen))}catch(e){}}
/* steps: [{sel, t (titolo), d (testo)}] ; host: elemento posizionato che contiene il tour */
function tour(host,key,steps,force){if(!host||(!force&&TOUR.seen[key]))return;steps=steps.filter(s=>host.querySelector(s.sel));if(!steps.length)return;
  tourEnd(true);let i=0;const ov=document.createElement('div');ov.className='tour';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label','Guida');
  ov.innerHTML='<div class="tour-hole"></div><div class="tour-tip" role="document"><div class="tt-dots"></div><h3 class="tt-t"></h3><p class="tt-d"></p><div class="tt-row"><button class="tt-skip" type="button">Salta</button><button class="tt-next" type="button">Avanti</button></div></div>';
  host.appendChild(ov);TOUR.active={ov,host,key};
  const hole=ov.querySelector('.tour-hole'),tip=ov.querySelector('.tour-tip');
  const show=()=>{const s=steps[i];const el=host.querySelector(s.sel);if(!el){next();return}
    el.scrollIntoView({block:'center',behavior:RM()?'auto':'smooth'});
    setTimeout(()=>{const hr=host.getBoundingClientRect(),r=el.getBoundingClientRect();const pad=8;ov.style.top=host.scrollTop+'px';ov.style.height=host.clientHeight+'px';
      const x=r.left-hr.left-pad,y=r.top-hr.top-pad,w=r.width+pad*2,h=r.height+pad*2;
      Object.assign(hole.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
      ov.querySelector('.tt-dots').innerHTML=steps.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('');
      ov.querySelector('.tt-t').textContent=s.t;ov.querySelector('.tt-d').textContent=s.d;
      ov.querySelector('.tt-next').textContent=i===steps.length-1?'Ho capito':'Avanti';
      const below=(y+h+180)<hr.height;tip.style.top=(below?y+h+12:Math.max(12,y-12-tip.offsetHeight))+'px';
      const tw=Math.min(320,hr.width-24);tip.style.width=tw+'px';tip.style.left=Math.max(12,Math.min(hr.width-tw-12,x+w/2-tw/2))+'px';
      tip.classList.remove('in');void tip.offsetWidth;tip.classList.add('in');SND.play('sheet');ov.querySelector('.tt-next').focus({preventScroll:true})},RM()?0:280)};
  const next=()=>{i++;if(i>=steps.length){TOUR.seen[key]=1;tourSave();tourEnd();SND.play('connect');return}show()};
  ov.querySelector('.tt-next').addEventListener('click',e=>{e.stopPropagation();next()});
  ov.querySelector('.tt-skip').addEventListener('click',e=>{e.stopPropagation();TOUR.seen[key]=1;tourSave();tourEnd()});
  ov.addEventListener('keydown',e=>{if(e.key==='Escape'){TOUR.seen[key]=1;tourSave();tourEnd()}});
  show()}
function tourEnd(silent){if(TOUR.active){const o=TOUR.active.ov;o.classList.add('out');setTimeout(()=>o.remove(),RM()?0:250);TOUR.active=null}}

/* ================= impronte dei codici ================= */
const ALF='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const normCodice=c=>String(c||'').toUpperCase().replace(/[^A-HJ-NP-Z2-9]/g,'').slice(0,6);
const fmtC=c=>{c=normCodice(c);return c.length>3?c.slice(0,3)+'-'+c.slice(3):c};
async function sha256hex(txt){const b=new TextEncoder().encode(txt);
  if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  throw new Error('Questo browser non supporta il calcolo sicuro delle impronte. Aggiornalo e riprova.')}
async function impronta(sale,codice){return sha256hex(sale+'|'+normCodice(codice))}
const breve=h=>h.slice(0,10);
function nuovoCodice(){const a=new Uint32Array(6);crypto.getRandomValues(a);return [...a].map(x=>ALF[x%ALF.length]).join('')}
function nuovoSale(){const a=new Uint8Array(16);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')}

/* ================= voci: forma compatta controllata dalle regole ================= */
/* "2026-12-25M1,2026-12-25P1,2026-12-31N2" : data, turno, livello */
function vociToStr(voci,livelli){return voci.map((v,i)=>v.g+v.t+livelli[i]).join(',')}
function strToVoci(s){if(!s)return [];const out=[];String(s).split(',').forEach(x=>{const m=/^(\d{4}-\d{2}-\d{2})([MPN])(\d{1,2})$/.exec(x);if(m)out.push({g:m[1],t:m[2],l:+m[3]})});
  out.forEach((v,i)=>{v.pari=i>0&&out[i-1].l===v.l});return out}
const reVoci=mese=>new RegExp('^('+mese+'-(0[1-9]|[12][0-9]|3[01])[MPN][0-9]{1,2})(,'+mese+'-(0[1-9]|[12][0-9]|3[01])[MPN][0-9]{1,2})*$');

/* ================= errori leggibili ================= */
class ErroreDati extends Error{constructor(codice,msg){super(msg);this.codice=codice}}
const MSG={permesso:'Operazione non consentita. La raccolta potrebbe essere chiusa o il codice non più valido.',rete:'Connessione assente. Controlla la rete e riprova.',chiusa:'La raccolta è chiusa: non si possono più inviare disponibilità.',codice:'Codice non riconosciuto.',login:'Email o password non corrette.'};

/* ================= backend simulato (modalità prova) ================= */
/* Stessi controlli delle regole Firestore. I dati restano solo in questo browser. */
function backendProva(){
  const KEY='tdl-prova-db';
  const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}};
  const save=db=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
  const db0=load();['impostazioni','codici','raccolte','risposte','riservato','pubblico'].forEach(k=>db0[k]=db0[k]||{});save(db0);
  const D=()=>{const d=load();['impostazioni','codici','raccolte','risposte','riservato','pubblico'].forEach(k=>d[k]=d[k]||{});return d};
  const rac=r=>r?Object.assign({},r,{chiusura:new Date(r.chiusura)}):null;
  let utente=null;const ascolta=[];
  const attesa=()=>new Promise(r=>setTimeout(r,120));
  return {
    modo:'prova',
    async impostazioni(){await attesa();return D().impostazioni.generale||null},
    async raccolte(){await attesa();const d=D();return Object.entries(d.raccolte).map(([id,r])=>Object.assign({id},rac(r)))},
    async codice(h){await attesa();return D().codici[h]||null},
    async totale(mese){return D().pubblico[mese]||null},
    async invia(mese,h,dati){await attesa();const d=D();
      const c=d.codici[h];if(!c||c.attivo!==true)throw new ErroreDati('permesso',MSG.codice);
      const r=d.raccolte[mese];if(!r||r.aperta!==true||new Date()>=new Date(r.chiusura))throw new ErroreDati('permesso',MSG.chiusa);
      const ok=/^20[0-9]{2}-(0[1-9]|1[0-2])$/.test(mese)&&Object.keys(dati).every(k=>['figura','voci','disp','nota','v'].includes(k))
        &&dati.figura===c.figura&&typeof dati.voci==='string'&&dati.voci.length<=1200&&reVoci(mese).test(dati.voci)
        &&Number.isInteger(dati.disp)&&dati.disp>=1&&dati.disp<=dati.voci.split(',').length&&typeof dati.nota==='string'&&dati.nota.length<=200&&dati.v===1;
      if(!ok)throw new ErroreDati('permesso',MSG.permesso);
      (d.risposte[mese]=d.risposte[mese]||{})[h]=Object.assign({},dati,{inviata:new Date().toISOString()});save(d)},
    /* gestione */
    utente(){return utente},
    onAuth(cb){ascolta.push(cb);setTimeout(()=>cb(utente),0)},
    async accedi(email,pw){await attesa();if(!email||!pw)throw new ErroreDati('login',MSG.login);utente={email,uid:'prova'};ascolta.forEach(f=>f(utente))},
    async esci(){utente=null;ascolta.forEach(f=>f(null))},
    async salvaImpostazioni(o){const d=D();d.impostazioni.generale=Object.assign({},d.impostazioni.generale||{},o);save(d)},
    async salvaRaccolta(id,o){const d=D();const x=Object.assign({},d.raccolte[id]||{},o);if(x.chiusura instanceof Date)x.chiusura=x.chiusura.toISOString();d.raccolte[id]=x;save(d)},
    async elimina_raccolta(id){const d=D();delete d.raccolte[id];save(d)},
    async codici(){const d=D();return Object.entries(d.codici).map(([h,c])=>Object.assign({h},c))},
    async salvaCodice(h,o){const d=D();d.codici[h]=Object.assign({},d.codici[h]||{},o);save(d)},
    async risposte(mese){await attesa();const d=D();return Object.entries(d.risposte[mese]||{}).map(([h,x])=>Object.assign({h},x,{inviata:new Date(x.inviata)}))},
    async riservato(mese){return D().riservato[mese]||{giorni:{}}},
    async salvaRiservato(mese,o){const d=D();d.riservato[mese]=o;save(d)},
    async salvaTotale(mese,n){const d=D();d.pubblico[mese]={totale:n,agg:new Date().toISOString()};save(d)},
    azzera(){try{localStorage.removeItem(KEY)}catch(e){}}
  }}

/* ================= backend Firebase ================= */
async function backendFirebase(cfg){
  const v=cfg.versioneFirebase||'12.11.0';const base='https://www.gstatic.com/firebasejs/'+v+'/';
  let A,F,AU;try{[A,F,AU]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-firestore.js'),import(base+'firebase-auth.js')])}
  catch(e){throw new ErroreDati('rete','Non riesco a caricare Firebase. Controlla la connessione e riprova.')}
  const app=A.initializeApp(cfg.firebase);const db=F.getFirestore(app);const auth=AU.getAuth(app);
  const d=(...p)=>F.doc(db,...p);
  const conv=x=>{if(!x)return x;const o={};for(const k in x){const val=x[k];o[k]=val&&typeof val.toDate==='function'?val.toDate():val}return o};
  const err=e=>{const c=String(e&&e.code||'');if(c.includes('permission'))return new ErroreDati('permesso',MSG.permesso);if(c.includes('unavailable'))return new ErroreDati('rete',MSG.rete);
    if(c.includes('auth/'))return new ErroreDati('login',MSG.login);return new ErroreDati('altro',e&&e.message||'Errore imprevisto.')};
  const T=async f=>{try{return await f()}catch(e){throw err(e)}};
  return {
    modo:'firebase',
    impostazioni:()=>T(async()=>{const s=await F.getDoc(d('impostazioni','generale'));return s.exists()?s.data():null}),
    raccolte:()=>T(async()=>{const q=await F.getDocs(F.collection(db,'raccolte'));return q.docs.map(s=>Object.assign({id:s.id},conv(s.data())))}),
    codice:h=>T(async()=>{const s=await F.getDoc(d('codici',h));return s.exists()?s.data():null}),
    totale:mese=>T(async()=>{const s=await F.getDoc(d('raccolte',mese,'pubblico','totale'));return s.exists()?conv(s.data()):null}),
    invia:(mese,h,dati)=>T(()=>F.setDoc(d('raccolte',mese,'risposte',h),Object.assign({},dati,{inviata:F.serverTimestamp()}))),
    utente:()=>auth.currentUser,
    onAuth:cb=>AU.onAuthStateChanged(auth,cb),
    accedi:(e,p)=>T(()=>AU.signInWithEmailAndPassword(auth,e,p)),
    esci:()=>AU.signOut(auth),
    /* updateDoc sostituisce i campi interi (per esempio la mappa dei festivi); se il documento non esiste ancora lo crea */
    salvaImpostazioni:o=>T(async()=>{const r=d('impostazioni','generale');const s=await F.getDoc(r);return s.exists()?F.updateDoc(r,o):F.setDoc(r,o)}),
    salvaRaccolta:(id,o)=>T(async()=>{const x=Object.assign({},o);if(x.chiusura instanceof Date)x.chiusura=F.Timestamp.fromDate(x.chiusura);const r=d('raccolte',id);const s=await F.getDoc(r);return s.exists()?F.updateDoc(r,x):F.setDoc(r,x)}),
    codici:()=>T(async()=>{const q=await F.getDocs(F.collection(db,'codici'));return q.docs.map(s=>Object.assign({h:s.id},conv(s.data())))}),
    salvaCodice:(h,o)=>T(()=>F.setDoc(d('codici',h),o,{merge:true})),
    risposte:mese=>T(async()=>{const q=await F.getDocs(F.collection(db,'raccolte',mese,'risposte'));return q.docs.map(s=>Object.assign({h:s.id},conv(s.data())))}),
    riservato:mese=>T(async()=>{const s=await F.getDoc(d('raccolte',mese,'riservato','daCoprire'));return s.exists()?s.data():{giorni:{}}}),
    salvaRiservato:(mese,o)=>T(()=>F.setDoc(d('raccolte',mese,'riservato','daCoprire'),o)),
    salvaTotale:(mese,n)=>T(()=>F.setDoc(d('raccolte',mese,'pubblico','totale'),{totale:n,agg:F.serverTimestamp()}))
  }}

async function apriBackend(){const cfg=window.TDL_CONFIG||{};const f=cfg.firebase||{};
  if(f.apiKey&&f.projectId&&!/INCOLLA/.test(f.apiKey))return backendFirebase(cfg);return backendProva()}

/* ================= Excel: scrittura e lettura senza librerie esterne ================= */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files){/* files: [{name, data:Uint8Array}] ; zip senza compressione */
  const enc=new TextEncoder();const parts=[];const central=[];let off=0;
  const w16=(a,v)=>a.push(v&255,(v>>>8)&255),w32=(a,v)=>a.push(v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255);
  files.forEach(f=>{const nm=enc.encode(f.name);const crc=crc32(f.data);const h=[];
    w32(h,0x04034b50);w16(h,20);w16(h,0x0800);w16(h,0);w16(h,0);w16(h,0x21);w32(h,crc);w32(h,f.data.length);w32(h,f.data.length);w16(h,nm.length);w16(h,0);
    const hb=new Uint8Array(h);parts.push(hb,nm,f.data);
    const c=[];w32(c,0x02014b50);w16(c,20);w16(c,20);w16(c,0x0800);w16(c,0);w16(c,0);w16(c,0x21);w32(c,crc);w32(c,f.data.length);w32(c,f.data.length);w16(c,nm.length);w16(c,0);w16(c,0);w16(c,0);w16(c,0);w32(c,0);w32(c,off);
    central.push(new Uint8Array(c),nm);off+=hb.length+nm.length+f.data.length});
  const cs=central.reduce((a,b)=>a+b.length,0);const e=[];w32(e,0x06054b50);w16(e,0);w16(e,0);w16(e,files.length);w16(e,files.length);w32(e,cs);w32(e,off);w16(e,0);
  return new Blob([...parts,...central,new Uint8Array(e)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
const xesc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
const colL=n=>{let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};
const excelData=dt=>(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate())-Date.UTC(1899,11,30))/86400000;
/* fogli: [{nome, righe:[[valori]], larghezze:[...]}] ; valori: stringa, numero, {data:Date} */
function creaXlsx(fogli){const enc=new TextEncoder();const F=[];
  const sheetXml=f=>{const rows=f.righe.map((r,i)=>`<row r="${i+1}">${r.map((v,j)=>{const ref=colL(j)+(i+1);const st=i===0?' s="1"':'';
      if(v===null||v===undefined||v==='')return '';if(typeof v==='number')return `<c r="${ref}"${st}><v>${v}</v></c>`;
      if(v&&v.data instanceof Date)return `<c r="${ref}" s="2"><v>${excelData(v.data)}</v></c>`;
      return `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xesc(v)}</t></is></c>`}).join('')}</row>`).join('');
    const cols=f.larghezze?`<cols>${f.larghezze.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols>`:'';
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${cols}<sheetData>${rows}</sheetData></worksheet>`};
  F.push({name:'[Content_Types].xml',x:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${fogli.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`});

/* lettura: restituisce {nomeFoglio: [[valori]]} ; usa DecompressionStream per i file compressi */
async function leggiXlsx(file){const buf=new Uint8Array(await file.arrayBuffer());const dv=new DataView(buf.buffer);
  let e=buf.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('Il file non sembra un Excel (.xlsx).');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};const dec=new TextDecoder();
  for(let i=0;i<n;i++){const meth=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=dec.decode(buf.subarray(p+46,p+46+nl));files[name]={meth,cs,lo};p+=46+nl+xl+cl}
  const get=async name=>{const f=files[name];if(!f)return null;const lnl=dv.getUint16(f.lo+26,true),lxl=dv.getUint16(f.lo+28,true);const data=buf.subarray(f.lo+30+lnl+lxl,f.lo+30+lnl+lxl+f.cs);
    if(f.meth===0)return dec.decode(data);if(f.meth!==8)throw new Error('Compressione non supportata.');
    if(typeof DecompressionStream==='undefined')throw new Error('Questo browser non sa leggere file compressi. Aggiornalo.');
    const s=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return await new Response(s).text()};
  const P=new DOMParser();const xml=t=>P.parseFromString(t,'application/xml');
  const wb=xml(await get('xl/workbook.xml'));const rels=xml(await get('xl/_rels/workbook.xml.rels'));
  const relMap={};[...rels.getElementsByTagName('Relationship')].forEach(r=>relMap[r.getAttribute('Id')]=r.getAttribute('Target'));
  const ssT=await get('xl/sharedStrings.xml');const ss=ssT?[...xml(ssT).getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')):[];
  const out={};
  for(const sh of [...wb.getElementsByTagName('sheet')]){const rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let tgt=relMap[rid];if(!tgt)continue;tgt=tgt.replace(/^\/?xl\//,'');const doc=xml(await get('xl/'+tgt)||'<x/>');const rows=[];
    [...doc.getElementsByTagName('c')].forEach(c=>{const ref=c.getAttribute('r');const m=/^([A-Z]+)(\d+)$/.exec(ref);if(!m)return;let col=0;for(const ch of m[1])col=col*26+ch.charCodeAt(0)-64;col--;const row=+m[2]-1;
      const t=c.getAttribute('t');let v=null;const ve=c.getElementsByTagName('v')[0];
      if(t==='s'&&ve)v=ss[+ve.textContent];else if(t==='inlineStr')v=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');else if(ve)v=t==='str'?ve.textContent:(isNaN(+ve.textContent)?ve.textContent:+ve.textContent);
      (rows[row]=rows[row]||[])[col]=v});
    out[sh.getAttribute('name')]=rows}
  return out}

function cRisposte(){if(!C.mese)return cHead('Risposte')+vuotoMese();const L=filtrate();const r=R(C.mese);const all=risposte(C.mese);const att=codiciAttivi().length;

  const cards=sorted.map(x=>{const open=C.aperta===x.c;return `<button class="rc2 ${open?'open':''}" data-c="riga" data-k="${x.c}" aria-expanded="${open}">

  return `${cHead('Risposte',`<button class="sbtn icon" data-c="export" data-k="xlsx" aria-label="Esporta in Excel">${I.dl}</button><button class="sbtn icon" data-c="ricarica" aria-label="Aggiorna">${IC_REFRESH}</button>`)}

   <div class="kpi"><small>Per figura</small><div class="two"><div><b>${all.filter(x=>x.f==='INF').length}</b><em>INF</em></div><div><b>${all.filter(x=>x.f==='OSS').length}</b><em>OSS</em></div></div></div>

function cMappa(){if(!C.mese)return cHead('Per turno')+vuotoMese();const L=filtrate();const giorni=giorniMese(C.mese);const cnt=conteggi(L);

  <div class="box privacy"><b>Il codice in chiaro si vede solo quando lo generi.</b> <span>Sul server resta solo un'impronta. Scarica subito l'elenco e copialo nel Registro Excel sul tuo computer, accanto ai nomi. Caricando il Registro qui vedi codici e nomi, senza inviarli al server.</span></div>
  <div class="tbl-wrap" style="max-height:440px"><table><thead><tr><th>${Object.keys(NOMI).length?'Codice':'Impronta'}</th>${C.nomi?'<th>Nome</th>':''}<th>Figura</th><th>Stato</th><th></th></tr></thead><tbody>
  ${lista.map(c=>{const n=NOMI[breve(c.h)];return `<tr><td class="mono">${n?fmtC(n.codice):'#'+breve(c.h)}</td>${C.nomi?`<td>${esc(n&&n.nome||'')}</td>`:''}<td><span class="fig ${c.figura}">${c.figura}</span></td><td><span class="st ${c.attivo?'open':'closed'}">${c.attivo?'Attivo':'Disattivato'}</span></td>

function cImpostazioni(){const r=R(C.mese);if(!r)return cHead('Impostazioni')+vuotoMese();const giorni=giorniMese(C.mese);const first=(fromIso(giorni[0]).getDay()+6)%7;

   ${giorni.map(g=>{const d=fromIso(g);return `<button class="${fm[g]?'on':''} ${d.getDay()===0?'sun':''}" data-c="fest" data-k="${g}" aria-pressed="${!!fm[g]}" title="${esc(fm[g]||'')}">${d.getDate()}</button>`}).join('')}</div></div>

const TOUR_GEST=[
 {sel:'.glance',t:'A colpo d\'occhio',d:'Turni coperti, risposte arrivate, giorni completi e turni ancora scoperti.'},
 {sel:'.calbox',t:'Il calendario',d:'Ogni giorno ha tre barre: Mattina, Pomeriggio, Notte. Rosso pochi, giallo giusti, verde tanti.'},
 {sel:'.panel',t:'Da attenzionare',d:'Qui trovi i turni con poche disponibilità. Tocca un giorno per vedere chi si è offerto.'},
 {sel:'.seg',t:'Infermieri e OSS',d:'Il calendario si legge per una figura alla volta.'},
 {sel:'[data-k="coprire"]',t:'Turni da coprire',d:'Segna quanti turni restano scoperti in ogni giorno: il calendario li confronta con le disponibilità.'},
 {sel:'[data-k="xlsx"]',t:'Esporta per il Registro',d:'Scarica l\'Excel anonimo e incollalo nel Registro sul tuo computer: i nomi compaiono da soli.'}];

function drawCoord(){const st=CROOT;if(!st)return;const prev=C._v;const scr=st.querySelector('.desk');const y=C.mob&&scr?scr.scrollTop:window.scrollY;st.innerHTML=vCoord();C._v=C.vista+C.mese+C.figura;
  if(prev===C._v){const nd=st.querySelector('.desk');if(C.mob&&nd)nd.scrollTop=y;else window.scrollTo(0,y)}
  if(prev!==C._v&&C.vista==='calendario'&&C.carico&&C._bad)setTimeout(()=>SND.play('alarm'),350);
  if(prev!==C._v&&!RM())st.querySelectorAll('.kpi b,.gb').forEach(el=>{const to=parseInt(el.textContent);if(isNaN(to)||to<2)return;const t0=performance.now();const f=t=>{const p=Math.min(1,(t-t0)/700);el.firstChild.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)});
  const lf=st.querySelector('#lf');if(lf)lf.addEventListener('submit',async e=>{e.preventDefault();const em=st.querySelector('#em').value.trim(),pw=st.querySelector('#pw').value;const btn=lf.querySelector('.btn');btn.disabled=true;
    try{await BACK.accedi(em,pw)}catch(er){btn.disabled=false;st.querySelector('#lerr').textContent=er.message||MSG.login;SND.play('alarmHi');const f=st.querySelector('.login form');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake')}});
  const q=st.querySelector('[data-c="cerca"]');if(q)q.addEventListener('input',()=>{C.cerca=q.value;const p=q.selectionStart;drawCoord();const n=st.querySelector('[data-c="cerca"]');n.focus();n.setSelectionRange(p,p)});
  const m=st.querySelector('[data-c="mese"]');if(m)m.addEventListener('change',async()=>{C.mese=m.value;C.cella=null;C.giorno=null;C.aperta=null;await conAttesa(()=>caricaMese(C.mese));drawCoord()});
  st.querySelectorAll('[data-c="needin"]').forEach(i=>i.addEventListener('change',()=>{const N=need(C.mese);const x=N.giorni[i.dataset.g];(x[i.dataset.t]=x[i.dataset.t]||{})[i.dataset.f]=i.value.trim().replace(/[^0-9?]/g,'').slice(0,3)||'?';C._needDirty=true;SND.play('tap')}));}

async function conAttesa(f){try{return await f()}catch(e){avviso('Qualcosa non è andato',esc(e.message||MSG.permesso));SND.play('alarmHi');throw e}}
function avviso(t,d){C.modal=`<h3>${t}</h3><p style="color:var(--text2);font-size:14px">${d}</p>`;drawCoord()}

const EXP_HEAD=['Raccolta','Impronta','Figura','Livello','Pari merito','Data','Giorno','Turno','Orario','Festivo','Disponibilita massima','Nota','Inviata il'];
function esportaRisposte(){const L=risposte(C.mese);const righe=[EXP_HEAD];
  L.slice().sort((a,b)=>a.c.localeCompare(b.c)).forEach(x=>x.voci.forEach((v,i)=>{const d=fromIso(v.g);righe.push([C.mese,breve(x.c),x.f,v.l,tieOf(x,i)?'si':'no',{data:d},GGL[d.getDay()],TURNI[v.t].nome,TURNI[v.t].da+'-'+TURNI[v.t].a,FEST[v.g]||(d.getDay()===0?'Domenica':''),x.disp,x.nota,pad(x.ts.getDate())+'/'+pad(x.ts.getMonth()+1)+'/'+x.ts.getFullYear()+' '+pad(x.ts.getHours())+':'+pad(x.ts.getMinutes())])}));
  scarica(creaXlsx([{nome:'Disponibilita',righe,larghezze:[10,13,8,8,10,12,11,12,11,14,12,30,17]}]),'turni-ideali-'+C.mese+'.xlsx');SND.play('ok')}
function esportaCodici(L){const righe=[['Codice','Impronta','Figura']].concat(L.map(x=>[fmtC(x.codice),breve(x.h),x.figura]));
  scarica(creaXlsx([{nome:'Codici',righe,larghezze:[12,14,8]}]),'turni-ideali-codici-'+iso(new Date())+'.xlsx')}
function stampaBigliettini(L){const url=location.href.replace(/admin\.html.*$/,'').replace(/[?#].*$/,'');
  let pa=document.getElementById('print-area');if(!pa){pa=document.createElement('div');pa.id='print-area';document.body.appendChild(pa)}
  pa.innerHTML=`<div class="pgrid">${L.map(x=>`<div class="pcard">${LOGO.replace('width="22" height="22"','width="26" height="26"')}<b>turni iDEAli</b><span class="pc">${fmtC(x.codice)}</span><small>${x.figura==='INF'?'Infermiere':'OSS'} · codice personale e anonimo</small><small>${esc(url)}</small></div>`).join('')}</div>`;
  setTimeout(()=>{try{window.print()}catch(e){}},100)}
async function leggiRegistro(file){const fogli=await leggiXlsx(file);const sh=fogli['Codici']||Object.values(fogli)[0];if(!sh)throw new Error('Nel file non trovo il foglio «Codici».');
  let n=0;for(const row of sh.slice(1)){if(!row)continue;const cod=normCodice(row[0]);if(cod.length!==6)continue;let imp=String(row[1]||'').toLowerCase();if(!/^[0-9a-f]{10}$/.test(imp))imp=breve(await impronta(IMPO.sale,cod));
    NOMI[imp]={codice:cod,nome:String(row[3]||'').trim(),figura:String(row[2]||'')};n++}
  if(!n)throw new Error('Nel foglio «Codici» non trovo codici validi.');return n}

/* ================= azioni ================= */
async function onCoordClick(e){const b=e.target.closest('[data-c]');if(!b||!CROOT||!CROOT.contains(b))return;const a=b.dataset.c,k=b.dataset.k;
  if(['mese','cerca','needin'].includes(a))return;
  if(a==='giorno'&&b.classList.contains('cc2'))rip(b);
  if(!['chiudi','fest','giorno'].includes(a))SND.play('tap');
  if(a==='vista'){if(C._needDirty&&C.vista==='coprire')await salvaNeed(true);C.vista=k;C.cella=null;C.giorno=null}
  else if(a==='tour'){if(C.vista!=='calendario'){C.vista='calendario';drawCoord()}setTimeout(()=>tourGest(true),200);return}
  else if(a==='esci'){await BACK.esci();return}
  else if(a==='setup'){const rep=CROOT.querySelector('#su-rep').value.trim()||'DEA';const mese=CROOT.querySelector('#su-mese').value;if(!/^\d{4}-\d{2}$/.test(mese))return;
    await conAttesa(async()=>{await BACK.salvaImpostazioni({reparto:rep,sale:nuovoSale(),turni:TURNI_BASE,creato:iso(new Date())});await creaRaccolta(mese);await caricaTutto()});C.carico=true;C.mese=mese;SND.play('ok')}
  else if(a==='apri'){C.mese=k;C.vista='calendario';C.giorno=null;await conAttesa(()=>caricaMese(k))}
  else if(a==='ricarica'){await conAttesa(()=>caricaMese(C.mese,true));SND.play('connect')}
  else if(a==='fig'){C.figura=k}
  else if(a==='riga'){C.aperta=C.aperta===k?null:k}
  else if(a==='cella'){C.cella=C.cella===k?null:k}
  else if(a==='giorno'){C.giorno=C.giorno===k?null:k;if(C.giorno){if(b.classList.contains('st-bad'))SND.play('alarm');else if(b.classList.contains('st-ok'))SND.play('ok');else SND.play('sheet')}else SND.play('desel')}
  else if(a==='infocal'){C.modal='<h3>Come si legge</h3><p style="color:var(--text2);font-size:14px">Nei giorni con turni da coprire ogni barra confronta le disponibilità con i turni scoperti. <b>Pochi</b>: meno di quelli da coprire. <b>Giusti</b>: fino a una volta e mezzo. <b>Tanti</b>: oltre. La stella indica un giorno completo. Negli altri giorni la barra grigia mostra solo quante disponibilità ci sono. Le disponibilità non sono turni assegnati.</p>'}
  else if(a==='nomi'){C.modal=`<h3>Carica il Registro</h3><p style="color:var(--text2);font-size:14px">Scegli il Registro Excel dal tuo computer. Codici e nomi restano in questa pagina e non vengono inviati al server. Quando chiudi la pagina spariscono.</p>
     <input type="file" accept=".xlsx" class="inp" style="padding:10px;height:auto" id="regfile"><p class="lerr" id="regerr"></p>`;drawCoord();
     const f=CROOT.querySelector('#regfile');f.addEventListener('change',async()=>{try{const n=await leggiRegistro(f.files[0]);C.nomi=true;C.modal=`<h3>Registro caricato</h3><p style="color:var(--text2);font-size:14px">${n} codici abbinati. I nomi restano solo in questa pagina.</p>`;SND.play('ok')}catch(er){CROOT.querySelector('#regerr').textContent=er.message;SND.play('alarmHi');return}drawCoord()});return}
  else if(a==='mostranomi'){C.nomi=true}
  else if(a==='nascondinomi'){C.nomi=false}
  else if(a==='toggle'||(a==='opt'&&k==='aperta')){const r=R(C.mese);await conAttesa(()=>BACK.salvaRaccolta(C.mese,{aperta:!r.aperta}));r.aperta=!r.aperta;SND.play(r.aperta?'connect':'desel')}
  else if(a==='opt'){const r=R(C.mese);const nv=k==='mostraTotale'?!(r.mostraTotale!==false):!r[k];await conAttesa(()=>BACK.salvaRaccolta(C.mese,{[k]:nv}));r[k]=nv}
  else if(a==='fest'){const r=R(C.mese);const fm=Object.assign({},r.festivi||{});if(fm[k])delete fm[k];else fm[k]=festivi(+k.slice(0,4))[k]||'Festivo';
     await conAttesa(()=>BACK.salvaRaccolta(C.mese,{festivi:fm}));r.festivi=fm;if(!fm[k])delete FEST[k];aggiungiFestivi(fm)}
  else if(a==='addcrit'){const g=k||(CROOT.querySelector('#addg')||{}).value;if(g){need(C.mese).giorni[g]=need(C.mese).giorni[g]||{M:{INF:'?',OSS:'?'},P:{INF:'?',OSS:'?'},N:{INF:'?',OSS:'?'}};C._needDirty=true;if(k){C.vista='coprire';C.giorno=null}}}
  else if(a==='addfest'){const N=need(C.mese);giorniMese(C.mese).filter(g=>isFest(g)).forEach(g=>{N.giorni[g]=N.giorni[g]||{M:{INF:'?',OSS:'?'},P:{INF:'?',OSS:'?'},N:{INF:'?',OSS:'?'}}});C._needDirty=true}
  else if(a==='rimcrit'){delete need(C.mese).giorni[k];C._needDirty=true}
  else if(a==='salvaneed'){await salvaNeed();return}
  else if(a==='salva'){await salvaImpostazioni();return}
  else if(a==='nuova'){const esist=new Set(RACCOLTE.map(r=>r.key));const opz=[];const d=new Date();for(let i=0;i<8;i++){const x=new Date(d.getFullYear(),d.getMonth()+i,1);const key=x.getFullYear()+'-'+pad(x.getMonth()+1);if(!esist.has(key))opz.push(key)}
     C.modal=`<h3>Nuova raccolta</h3><p style="color:var(--text2);font-size:14px">Festivi, tema e chiusura (10 del mese precedente) si impostano da soli; puoi cambiarli dopo.</p><select class="sel" id="nm" style="width:100%;height:46px">${opz.map(k2=>`<option value="${k2}">${labMese(k2)}</option>`).join('')}</select><div class="mrow"><button class="sbtn pri" data-c="crea">Crea</button></div>`}
  else if(a==='crea'){const key=CROOT.querySelector('#nm').value;await conAttesa(async()=>{await creaRaccolta(key);await caricaTutto()});C.mese=key;await caricaMese(key);C.vista='impostazioni';C.modal=null;SND.play('ok')}
  else if(a==='export'){if(k==='xlsx'){esportaRisposte();return}}
  else if(a==='dlcodici'){if(C.ultimiCodici)esportaCodici(C.ultimiCodici);return}
  else if(a==='stampa'){const L=k==='registro'?Object.entries(NOMI).map(([h,n])=>({codice:n.codice,figura:n.figura||'',h})):(C.ultimiCodici||[]);stampaBigliettini(L);return}
  else if(a==='genera'){const n=Math.min(200,Math.max(1,+CROOT.querySelector('#gn').value||1));const f=CROOT.querySelector('#gf').value;
     const L=[];await conAttesa(async()=>{for(let i=0;i<n;i++){const codice=nuovoCodice();const h=await impronta(IMPO.sale,codice);await BACK.salvaCodice(h,{figura:f,attivo:true,creato:new Date().toISOString()});L.push({codice,h,figura:f});NOMI[breve(h)]={codice,nome:'',figura:f}}});
     C.codici=await BACK.codici();C.ultimiCodici=L;SND.play('ok');
     C.modal=`<h3>${n} codici generati</h3><p style="color:var(--text2);font-size:14px"><b>Scarica subito l'elenco:</b> dopo la chiusura della pagina i codici in chiaro non si possono più rivedere. Copialo nel foglio «Codici» del Registro e scrivi accanto i nomi.</p><pre>${L.map(x=>fmtC(x.codice)+'   '+x.figura).join('\n')}</pre><div class="mrow"><button class="sbtn pri" data-c="dlcodici">${I.dl} Scarica l'elenco</button><button class="sbtn" data-c="stampa">Stampa i bigliettini</button></div>`}
  else if(a==='sostituisci'){const c=C.codici.find(x=>x.h===k);if(!c)return;C.modal=`<h3>Sostituire questo codice?</h3><p style="color:var(--text2);font-size:14px">Il codice ${esc(chi(k))} smetterà di funzionare e ne verrà creato uno nuovo per la stessa figura (${c.figura}). Le risposte già inviate restano.</p><div class="mrow"><button class="sbtn warn" data-c="sostok" data-k="${k}">Sostituisci</button></div>`}
  else if(a==='sostok'){const c=C.codici.find(x=>x.h===k);const old=NOMI[breve(k)];let nuovo;
     await conAttesa(async()=>{await BACK.salvaCodice(k,{attivo:false});const codice=nuovoCodice();const h=await impronta(IMPO.sale,codice);await BACK.salvaCodice(h,{figura:c.figura,attivo:true,creato:new Date().toISOString()});nuovo={codice,h,figura:c.figura};NOMI[breve(h)]={codice,nome:old?old.nome:'',figura:c.figura}});
     C.codici=await BACK.codici();C.ultimiCodici=[nuovo];SND.play('ok');
     C.modal=`<h3>Codice sostituito</h3><p style="color:var(--text2);font-size:14px">Consegna questo nuovo codice alla stessa persona e aggiornalo nel Registro:</p><p class="mono" style="font-size:32px;margin:6px 0">${fmtC(nuovo.codice)}</p><div class="mrow"><button class="sbtn pri" data-c="dlcodici">${I.dl} Scarica</button><button class="sbtn" data-c="stampa">Stampa il bigliettino</button></div>`}
  else if(a==='demo'){await datiProva();await caricaTutto();await caricaMese(C.mese,true);C.modal='<h3>Dati di prova creati</h3><p style="color:var(--text2);font-size:14px">Codici e risposte inventati, solo in questo browser.</p>'}
  else if(a==='azzera'){BACK.azzera();location.reload();return}
  else if(a==='chiudi'){if(e.target!==b&&!e.target.closest('button[data-c="chiudi"]'))return;C.modal=null}
  else return;
  drawCoord()}

async function creaRaccolta(key){await BACK.salvaRaccolta(key,{titolo:'Disponibilità di '+labMese(key).toLowerCase(),chiusura:chiusuraStd(key),aperta:true,tema:temaAuto(key),critico:temaAuto(key)!=='standard',mostraTotale:true,festivi:festiviMese(key),creata:iso(new Date())});
  const N={giorni:{}};giorniMese(key).filter(g=>festiviMese(key)[g]||fromIso(g).getDay()===0||(key.endsWith('-12')&&/-(24|31)$/.test(g))).forEach(g=>N.giorni[g]={M:{INF:'?',OSS:'?'},P:{INF:'?',OSS:'?'},N:{INF:'?',OSS:'?'}});
  await BACK.salvaRiservato(key,N)}
async function salvaNeed(silenzioso){await conAttesa(()=>BACK.salvaRiservato(C.mese,need(C.mese)));C._needDirty=false;if(!silenzioso){SND.play('ok');avviso('Salvato','I turni da coprire sono aggiornati.')}}
async function salvaImpostazioni(){const r=R(C.mese);const v=id=>(CROOT.querySelector('#'+id)||{}).value;
  const ch=new Date(v('im-ch'));if(isNaN(ch)){avviso('Data non valida','Controlla la data di chiusura.');return}
  const turni={};['M','P','N'].forEach(t=>turni[t]={nome:(v('tn-'+t)||TURNI[t].nome).slice(0,20),da:(v('td-'+t)||TURNI[t].da).slice(0,6),a:(v('ta-'+t)||TURNI[t].a).slice(0,6)});
  await conAttesa(async()=>{await BACK.salvaRaccolta(C.mese,{titolo:(v('im-tit')||r.titolo).slice(0,80),chiusura:ch,tema:v('im-tema')});await BACK.salvaImpostazioni({reparto:(v('im-rep')||'DEA').slice(0,40),turni})});
  r.titolo=v('im-tit')||r.titolo;r.chiusura=ch;r.tema=v('im-tema');IMPO.reparto=v('im-rep');IMPO.turni=turni;applicaTurni(turni);SND.play('ok');avviso('Salvato','Le impostazioni sono online.')}

/* dati inventati per la sola modalità prova */
async function datiProva(){const r=()=>Math.random();const mese=C.mese;if(!mese)return;const L=[];
  for(let i=0;i<24;i++){const codice=nuovoCodice();const f=i<15?'INF':'OSS';const h=await impronta(IMPO.sale,codice);await BACK.salvaCodice(h,{figura:f,attivo:true,creato:new Date().toISOString()});L.push({codice,h,f});NOMI[breve(h)]={codice,nome:'Collega '+f+' '+pad(i+1)+' (prova)',figura:f}}
  const giorni=giorniMese(mese);const pesi=giorni.map(g=>isFest(g)?4:1);const tot=pesi.reduce((a,b)=>a+b,0);const pick=()=>{let x=r()*tot;for(let i=0;i<giorni.length;i++){x-=pesi[i];if(x<=0)return giorni[i]}return giorni[0]};
  for(const x of L.slice(0,19)){const voci=[];const seen=new Set();const nv=1+Math.floor(r()*6);for(let k=0;k<nv;k++){const g=pick(),t='MPN'[Math.floor(r()*3)];if(!seen.has(g+t)){seen.add(g+t);voci.push({g,t,pari:voci.length>0&&r()<.2})}}
    let l=0;const lv=voci.map(v=>{if(!v.pari)l++;return l});
    try{await BACK.invia(mese,x.h,{figura:x.f,voci:vociToStr(voci,lv),disp:Math.max(1,Math.min(voci.length,1+Math.floor(r()*3))),nota:r()<.3?'Preferisco turni non consecutivi.':'',v:1})}catch(e){}}
  C.ultimiCodici=L.map(x=>({codice:x.codice,h:x.h,figura:x.f}));C.nomi=true}

/* ================= avvio ================= */
async function avvioGestione(){CROOT=document.getElementById('groot');CROOT.innerHTML='<div class="desk"><div class="setup"><span class="spin"></span> Caricamento…</div></div>';
  try{BACK=await apriBackend()}catch(e){CROOT.innerHTML=`<div class="desk"><div class="setup"><h2>Non riesco a collegarmi</h2><p class="sub">${esc(e.message||MSG.rete)}</p></div></div>`;return}
  BACK.onAuth(async u=>{C.logged=!!u;C.carico=false;if(!u){IMPO=null;drawCoord();return}
    drawCoord();try{const ok=await caricaTutto();C.carico=ok}catch(e){C.carico=false;CROOT.innerHTML=`<div class="desk"><div class="setup"><h2>Accesso non autorizzato</h2><p class="sub">${esc(e.message)} Controlla che l'UID di questo account sia nelle regole di Firestore.</p><button class="sbtn" data-c="esci">Esci</button></div></div>`;return}
    SND.play('on');drawCoord();if(C.carico)setTimeout(()=>tourGest(),1400)})}
document.addEventListener('click',onCoordClick);
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const t=e.target.closest&&e.target.closest('tr.row');if(t&&CROOT&&CROOT.contains(t))t.click()}if(e.key==='Escape'&&C.modal){C.modal=null;drawCoord()}});
window.addEventListener('beforeunload',e=>{if(C._needDirty){e.preventDefault();e.returnValue=''}});
avvioGestione();

</script>
